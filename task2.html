<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h1>course registration</h1>
    <fieldset>
        <legend><b>personal details</b></legend>
    <form action="Demo.html">
        <table>
            <tr>
               <td><label>First Name</label></td>
                <td><input type="text" name="FN" placeholder="Ex:sai charan" required size="16"></td>
            </tr>
            <tr>
                <td><label>Surname</label></td>
                <td><input type="text" name="SN" placeholder="Ex:Gunreddy" required size="16"></td>
            </tr>
            <tr>


                <td><label>Mobile Number</label></td>
                <td><input type="tel" name="MB" placeholder="Ex:9652416417" required size="16"></td>
            </tr>
        </table>
        <label>Email</label>
        <input type="email" name="email" placeholder="ex:saicharan@gmail.com" required size="16"><br>

        <label>Password</label>
        <input type="password" name="password" size="16"><br>

        <label>Confirm Password</label>
        <input type="password" name="confirm password" size="16"><br>

        <label>DOB</label>
        <input type="date" ><br>

        <label>Gender</label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Others<br>

        <label>Select Country</label>
        <select>
            <option>INDIA</option>
            <option>USA</option>
        </select><br>

        <label>Upload File</label>
        <input type="file" name="file"><br>

        <input type="reset"><br>
        <input type="submit">
    </fieldset>

        

    </form>

    
</body>
</html>
